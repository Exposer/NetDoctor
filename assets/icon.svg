<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#34d8c4"/>
      <stop offset="0.55" stop-color="#1c8fe6"/>
      <stop offset="1" stop-color="#0b4fd1"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".30"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#021a4d" flood-opacity=".38"/>
    </filter>
    <filter id="ln" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#032a73" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#sh)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#gloss)"/>
  <!-- Wi-Fi arcs -->
  <g fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" filter="url(#ln)">
    <path d="M 434.2 442.2 A 110 110 0 0 1 589.8 442.2" opacity="1"/>
    <path d="M 363.5 371.5 A 210 210 0 0 1 660.5 371.5" opacity=".94"/>
    <path d="M 292.8 300.8 A 310 310 0 0 1 731.2 300.8" opacity=".84"/>
  </g>
  <circle cx="512" cy="520" r="40" fill="#fff" filter="url(#ln)"/>
  <!-- heartbeat line -->
  <path d="M 190 724 L 372 724 L 428 626 L 498 826 L 572 664 L 616 724 L 834 724"
        fill="none" stroke="#fff" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" filter="url(#ln)"/>
</svg>
